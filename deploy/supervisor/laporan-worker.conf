; Supervisor untuk queue worker aplikasi Laporan.
; Salin ke /etc/supervisor/conf.d/laporan-worker.conf lalu:
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status laporan-worker:*

[program:laporan-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php85 /var/www/laporan/artisan queue:work --sleep=3 --tries=3 --timeout=120 --max-time=3600
directory=/var/www/laporan
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/laporan/storage/logs/worker.log
stopwaitsecs=3600
